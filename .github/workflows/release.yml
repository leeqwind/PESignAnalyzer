name: Release OpenSSL analyzer

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (for example v1.3.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve existing tag
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z._+-]*$ ]] || { echo 'Invalid version tag'; exit 1; }
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x64
            architecture: x64
            triplet: x64-windows-static
          - os: windows-2022
            platform: windows-x86
            architecture: Win32
            triplet: x86-windows-static
    runs-on: ${{ matrix.os }}
    steps:
      # Keep release tooling from the workflow revision, even for older source tags.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies and configure
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libcurl4-openssl-dev
          cmake -S source/openssl -B build/openssl -DCMAKE_BUILD_TYPE=Release
      - name: macOS dependencies and configure
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 curl dylibbundler
          cmake -S source/openssl -B build/openssl -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" -DCURL_ROOT="$(brew --prefix curl)"
      - name: Windows dependencies and configure
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "openssl:${{ matrix.triplet }}" "curl:${{ matrix.triplet }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S source/openssl -B build/openssl -A ${{ matrix.architecture }} "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build
        run: cmake --build build/openssl --config Release --parallel
      - name: Test
        run: ctest --test-dir build/openssl -C Release --output-on-failure
      - name: Package and test extracted archive
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          VCPKG_TRIPLET: ${{ matrix.triplet }}
        run: python tooling/.github/scripts/package-release.py --source source --build build/openssl --output packages
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: packages/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: packages
      - name: Verify packages and publish release
        shell: bash
        run: |
          set -euo pipefail
          cd packages
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 4
          sha256sum --check -- *.sha256
          # Refuse to publish if the remote tag moved during the build.
          ref=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha + " " + .object.type')
          read -r sha kind <<< "$ref"
          while [[ "$kind" == tag ]]; do
            ref=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object.sha + " " + .object.type')
            read -r sha kind <<< "$ref"
          done
          test "$kind" = commit && test "$sha" = "$SOURCE_COMMIT"
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            printf 'OpenSSL analyzer built from `%s` (%s).\n\nWindows x64/x86, Linux x64 (Ubuntu 24.04+), macOS arm64 (macOS 15+).\nLinux requires libssl3t64 and libcurl4t64; Windows includes static dependencies; macOS includes non-system dylibs.\nSee README.txt and BUILD-INFO.json in each archive.\n' "$RELEASE_TAG" "$SOURCE_COMMIT" > ../release-notes.md
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file ../release-notes.md
          fi
          gh release upload "$RELEASE_TAG" ./*.zip ./*.tar.gz ./*.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false
